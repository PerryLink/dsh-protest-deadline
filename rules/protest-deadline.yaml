# 质疑与投诉期限核对 规则库
#
# 规则数据与代码分离：替换本文件即可切换规则集版本，无需改动 TypeScript。
#
# 条款引用纪律（由 shared/ruleset.ts 强制校验）：
#   - 每条规则必须写全 document / number / clause / excerpt / kind / source，
#     且 excerpt 必须是逐字摘录，不得改写。
#   - kind: direct                       条款直接规定了所检查的要求
#   - kind: derived-from-principle       条款未直接规定，仅能由原则性条款推论（severity 最多 warn）
#   - kind: institutional-configuration 阈值出自本机构配置（severity 最多 info）
#
# ⚠️⚠️ 本规则库的诚实说明：**excerpt 一律不是引文。**
#   本插件核对的是"质疑与投诉台账"中的**日期自洽与期限窗口**。
#   其规范载体是 **《政府采购质疑和投诉办法》（财政部令第94号）**
#   与《中华人民共和国政府采购法》及其实施条例。
#   ⚠️ **《政府采购质疑和投诉办法》全文已逐字核对**（见 rules/evidence/clause-verification.md）：
#   核到第十条／第十三条（均按 7 个工作日）、第十七条（答复期满后 15 个工作日内投诉）、
#   第二十一条（5 个工作日审查、8 个工作日发通知书）、第二十六条（30 个工作日作出处理决定）、
#   第二十七条（检验检测鉴定评审时间不计入）、第四十二条（**期间开始之日不计算在期间内、
#   期间届满最后 1 日是节假日的顺延**）。
#   ⇒ **取得条文后确认了本库"不硬编码天数"的判断成立**：期限按工作日计且有起算与顺延规则，
#   而台账通常只记自然日。
#   ⚠️ 该办法**第四十五条同时废止了财政部令第 20 号《政府采购供应商投诉处理办法》**，本库不得引用。
#   ⚠️ **上位法《政府采购法》全文也已逐字核对**（见 rules/evidence/clause-verification-law.md，
#   中国政府网《国务院公报》2002 年第 21 号）：**第五十二条**（知道或应知权益受损之日起
#   **7 个工作日**内书面质疑）、**第五十三条**（收到质疑后 **7 个工作日**内答复）、
#   **第五十五条**（**答复期满后 15 个工作日**内向"**同级**"监督管理部门投诉）、
#   **第五十六条**（收到投诉后 **30 个工作日**内作出处理决定）、**第五十七条**（暂停采购最长 **30 日**）。
#   ⇒ **上位法与部门规章的期限完全吻合**，且**上位法同样使用"工作日"** —— 独立印证了
#   "不硬编码天数"的判断。⚠️ 上位法**第八十五条**规定：因**严重自然灾害和其他不可抗力事件所实施的
#   紧急采购**与**涉及国家安全和秘密的采购**"**不适用本法**" ⇒ **拿本插件去核对这两类采购即为越界**。
#   ⚠️ **本次读到的是 2002 年公布文本，2014 年修正版未取得**，故不对"现行有效性"作断言。
#   **《政府采购法实施条例》本次未取得逐字条文**，
#   因此本规则库**不伪造任何"原文"**：每条规则的 excerpt 都写明"该条文本次未取得"
#   （**理由不是"取不到"，而是"核对对象是台账而非采购行为"** —— 见两份 evidence 报告的同节），
#   依据状态放在 note 里如实说明；kind 一律降为 derived-from-principle（封顶 warn）
#   或 institutional-configuration（封顶 info）。
#   本插件的命中信息只应被读作"这个日期没填 / 先后对不上 / 超出你配置的窗口"，
#   而**不是**"质疑已过期失效"或"违反质疑投诉规定"。
#
# ⚠️⚠️ 另一条**必须保留**的边界：**本插件绝不判定某项质疑或投诉是否已被受理、
#   是否已经逾期失效、是否应当驳回**。那需要采购人或财政部门依法定职权、结合
#   送达日期与工作日计算作出判断，而**台账里通常只记了日期、记不全送达与工作日口径**。
#   → 因此本插件只核对**台账自身的齐备与自洽**：
#     关键日期是否填齐、日期的先后关系是否可能、答复是否落在台账写明的期限内、
#     处理状态是否在册、质疑函编号是否重复。
#   → **本插件不硬编码任何天数**：法定答复期限以**工作日**计算并可能有起算规则，
#     而台账通常只记自然日，二者混用会算出错误结论，故期限一律由使用方算出后写入台账。

plugin: dsh-protest-deadline
version: "2026.1"

rules:
  - id: PD-001
    title: 质疑台账应填写提出日期或答复日期
    severity: warn
    basis:
      document: 《政府采购质疑和投诉办法》
      number: 财政部令第94号（2017 年 12 月 26 日公布，自 2018 年 3 月 1 日起施行；六章四十五条。⚠️ 本令第四十五条同时废止财政部令第20号《政府采购供应商投诉处理办法》）
      clause: 第十条（质疑的提出）与第十三条（答复）
      excerpt: 供应商认为采购文件、采购过程、中标或者成交结果使自己的权益受到损害的，可以在知道或者应知其权益受到损害之日起7个工作日内，以书面形式向采购人、采购代理机构提出质疑。采购人、采购代理机构不得拒收质疑供应商在法定质疑期内发出的质疑函，应当在收到质疑函后7个工作日内作出答复，并以书面形式通知质疑供应商和其他有关供应商。
      kind: direct
      source: https://www.gov.cn/gongbao/content/2018/content_5288825.htm
    params:
      check:
        kind: presenceAny
        fields: [raisedAt, replyAt]
        fix: 补填质疑提出日期与答复日期；本条只核对是否填写，不判断是否在法定期限内
    note: >-
      ✅ **本条已于 2026-10-07 换为逐字引文并回填条号**（见 rules/evidence/clause-verification.md）。
      ✅ kind 已升为 direct（2026-10-07）：**第十条**逐字规定质疑应「在知道或者应知其权益受到损害之日起**7 个工作日内**……提出」，**第十三条**规定「应当在**收到质疑函后 7 个工作日内**作出答复」——**两个日期都是该办法直接要求的时点**。
      提出日期与答复日期是期限核对的两个端点：缺其一，期限窗口就无从计算。
      本次未取得明文条号，故封顶 warn。
      本条只核对"至少填了一个"，**不判断该质疑是否在法定期限内提出**——
      那需要结合知道或应知权益受损害之日、送达日期与工作日计算，台账里通常记不全。

  - id: PD-002
    title: 答复日期不应早于质疑提出日期
    severity: warn
    basis:
      document: 《政府采购质疑和投诉办法》
      number: 财政部令第94号（2017 年 12 月 26 日公布，自 2018 年 3 月 1 日起施行；六章四十五条。⚠️ 本令第四十五条同时废止财政部令第20号《政府采购供应商投诉处理办法》）
      clause: 第十三条（答复期限）与第十二条（质疑函应记明提出质疑的日期）
      excerpt: 供应商提出质疑应当提交质疑函和必要的证明材料。质疑函应当包括下列内容：（一）供应商的姓名或者名称、地址、邮编、联系人及联系电话；（二）质疑项目的名称、编号；（三）具体、明确的质疑事项和与质疑事项相关的请求；（四）事实依据；（五）必要的法律依据；（六）提出质疑的日期。采购人、采购代理机构不得拒收质疑供应商在法定质疑期内发出的质疑函，应当在收到质疑函后7个工作日内作出答复，并以书面形式通知质疑供应商和其他有关供应商。
      kind: direct
      source: https://www.gov.cn/gongbao/content/2018/content_5288825.htm
    params:
      check:
        kind: date
        field: raisedAt
        notAfterField: replyAt
        fix: 答复日期不应早于质疑提出日期；核对两个日期的填写
    note: >-
      ✅ **本条已于 2026-10-07 换为逐字引文并回填条号**（见 rules/evidence/clause-verification.md）。
      ✅ kind 已升为 direct（2026-10-07）：**第十二条第（六）项**要求质疑函载明「**提出质疑的日期**」，**第十三条**要求「**收到质疑函后** 7 个工作日内」答复——**答复以收到质疑函为起算点，故答复日期不应早于质疑提出日期**。
      "先质疑、后答复"是流程的**时间前提**；日期可解析是台账能被程序处理的前提。
      本次未取得明文条号，故封顶 warn。
      本条比较提出日期与答复日期（同一天视为不晚于）。
      日期无法解析时会单独报出，**不会静默跳过**。

  - id: PD-003
    title: 答复日期应落在台账写明的答复期限内
    severity: info
    basis:
      document: 《政府采购质疑和投诉办法》
      number: 财政部令第94号（2017 年 12 月 26 日公布，自 2018 年 3 月 1 日起施行；六章四十五条。⚠️ 本令第四十五条同时废止财政部令第20号《政府采购供应商投诉处理办法》）
      clause: 第十三条（答复期限为收到质疑函后 7 个工作日）—— ⚠️ 本条核对的是台账写明的 dueAt，取值属本机构口径
      excerpt: 采购人、采购代理机构不得拒收质疑供应商在法定质疑期内发出的质疑函，应当在收到质疑函后7个工作日内作出答复，并以书面形式通知质疑供应商和其他有关供应商。
      kind: institutional-configuration
      source: https://www.gov.cn/gongbao/content/2018/content_5288825.htm
    params:
      check:
        kind: date
        field: replyAt
        notBeforeField: raisedAt
        notAfterField: replyDueAt
    note: >-
      ✅ **本条已于 2026-10-07 换为逐字引文并回填条号**（见 rules/evidence/clause-verification.md）。
      ⚠️ kind 仍为 institutional-configuration（2026-10-07 经逐字核对后确认）：**第十三条给出的是法定答复期限——收到质疑函后 7 个工作日**；而本条核对的 `dueAt` 是**台账自己写明的答复期限**。⚠️ **本条不把 7 个工作日内置为判定值**（用户已就此明确要求）。
      本条只在台账**已经写明答复期限**（replyDueAt）时，核对实际答复日期是否落在其中。
      依据说明（据财政部令第94号逐字核对，见 rules/evidence/clause-verification.md）：
      ① **第十条**「知道或者应知其权益受到损害之日起**7 个工作日内**……提出质疑」、
      **第十三条**「应当在收到质疑函后**7 个工作日内**作出答复」—— 期限按**工作日**计；
      ② **第四十二条**「本办法规定的**期间开始之日，不计算在期间内**。期间届满的最后 1 日是节假日的，
      以节假日后的第 1 日为期间届满的日期」—— 另有**起算与顺延**两项规则；
      ③ **第十七条**把投诉权起点定在「**答复期满后** 15 个工作日内」，起算点不是答复之日。
      ⇒ 台账通常只记自然日、且不记送达日期，**用条文天数直接比对必然算错**，
      故本插件**不硬编码任何天数**，期限应由使用方按本办法算出后写入台账的 replyDueAt 栏。
      replyDueAt 为空时本条进 skipped，**不会假定任何期限**。
      本条命中只表示"与你写在台账里的期限不一致"，**不表示答复已逾期**。

  - id: PD-004
    title: 投诉日期不应早于答复日期
    severity: warn
    basis:
      document: 《政府采购质疑和投诉办法》
      number: 财政部令第94号（2017 年 12 月 26 日公布，自 2018 年 3 月 1 日起施行；六章四十五条。⚠️ 本令第四十五条同时废止财政部令第20号《政府采购供应商投诉处理办法》）
      clause: 第十七条（答复期满后 15 个工作日内提起投诉）
      excerpt: 质疑供应商对采购人、采购代理机构的答复不满意，或者采购人、采购代理机构未在规定时间内作出答复的，可以在答复期满后15个工作日内向本办法第六条规定的财政部门提起投诉。
      kind: direct
      source: https://www.gov.cn/gongbao/content/2018/content_5288825.htm
    params:
      check:
        kind: date
        field: replyAt
        notAfterField: complaintAt
    note: >-
      ✅ **本条已于 2026-10-07 换为逐字引文并回填条号**（见 rules/evidence/clause-verification.md）。
      ✅ kind 已升为 direct（2026-10-07）：**第十七条**逐字规定「可以在**答复期满后 15 个工作日内**向……财政部门提起投诉」——**投诉以答复期满为起算点，故投诉日期不应早于答复日期**。
      投诉以质疑为前提，故**投诉日期不应早于答复日期**。
      依据说明（据财政部令第94号第十七条逐字核对）：该条把投诉权定在「质疑供应商对采购人、
      采购代理机构的答复不满意，或者采购人、采购代理机构未在规定时间内作出答复的，
      可以在**答复期满后** 15 个工作日内……提起投诉」——**投诉必然发生在答复程序之后**，
      故"投诉日期早于答复日期"在程序上不可能，这是**流程的时间前提**，封顶 warn。
      本条只在台账同时提供答复日期与投诉日期时执行；
      若某条记录尚未答复即已投诉，那是需要人工确认的异常，而不是本条的错误。
      日期无法解析时会单独报出。

  - id: PD-005
    title: 处理状态应使用本机构口径的取值
    severity: info
    basis:
      document: 《政府采购质疑和投诉办法》
      number: 财政部令第94号（2017 年 12 月 26 日公布，自 2018 年 3 月 1 日起施行；六章四十五条。⚠️ 本令第四十五条同时废止财政部令第20号《政府采购供应商投诉处理办法》）
      clause: 第二十一条至第二十九条（投诉的审查、处理与驳回情形）—— ⚠️ 处理状态取值属本机构口径
      excerpt: 财政部门收到投诉书后，应当在5个工作日内进行审查，审查后按照下列情况处理……（四）投诉符合本办法第十八条、第十九条规定的，自收到投诉书之日起即为受理……
      kind: institutional-configuration
      source: https://www.gov.cn/gongbao/content/2018/content_5288825.htm
    params:
      check:
        kind: enum
        field: status
        values: []
    note: >-
      ✅ **本条已于 2026-10-07 换为逐字引文并回填条号**（见 rules/evidence/clause-verification.md）。
      ⚠️ kind 仍为 institutional-configuration：**第二十一条**规定审查后的四种处理情形（补正、不予受理、告知管辖、受理），**第二十九条**列举应当驳回的四种情形；**但核对表里"处理状态"栏的取值属本机构口径**。
      values 出厂为空，表示**未配置**，本条进 skipped。
      依据说明：处理状态的口径（例如「待答复」「已答复」「已投诉」「已处理完毕」「已撤回」）
      随**本机构或本项目台账**变化，本插件**不硬编码任何取值清单**。
      本条只核对所填值是否在册，**不判断该质疑投诉应如何处理**。

  - id: PD-006
    title: 台账应声明采购项目与质疑提出日期
    severity: warn
    basis:
      document: 《政府采购质疑和投诉办法》
      number: 财政部令第94号（2017 年 12 月 26 日公布，自 2018 年 3 月 1 日起施行；六章四十五条。⚠️ 本令第四十五条同时废止财政部令第20号《政府采购供应商投诉处理办法》）
      clause: 第十二条（质疑函应当包括质疑项目的名称、编号等）
      excerpt: 供应商提出质疑应当提交质疑函和必要的证明材料。质疑函应当包括下列内容：（一）供应商的姓名或者名称、地址、邮编、联系人及联系电话；（二）质疑项目的名称、编号；（三）具体、明确的质疑事项和与质疑事项相关的请求；（四）事实依据；（五）必要的法律依据；（六）提出质疑的日期。
      kind: derived-from-principle
      source: https://www.gov.cn/gongbao/content/2018/content_5288825.htm
    params:
      check:
        kind: headerPresence
        fields: [project]
    note: >-
      ✅ **本条已于 2026-10-07 换为逐字引文并回填条号**（见 rules/evidence/clause-verification.md）。
      ⚠️ kind 仍为 derived-from-principle：**第十二条**要求质疑函载明项目名称、编号与提出质疑的日期，**但未要求任何台账声明采购项目与质疑提出日期**——那是结论可追溯性的前提。
      台账若不写明采购项目，期限与答复情况无法与该项目的采购活动对应。
      本次未取得明文条号，故封顶 warn。
      配置项 project 对应材料顶层的项目名称。
      若本机构表式还在表头记录质疑提出日期，把 fields 改为 [project, raisedAt] 即可；
      本条默认只核对项目名称，因为提出日期通常是**逐条记录**的列而非表头字段。

  - id: PD-007
    title: 质疑函编号不应在台账内重复
    severity: warn
    basis:
      document: 《政府采购质疑和投诉办法》
      number: 财政部令第94号（2017 年 12 月 26 日公布，自 2018 年 3 月 1 日起施行；六章四十五条。⚠️ 本令第四十五条同时废止财政部令第20号《政府采购供应商投诉处理办法》）
      clause: 第十三条（不得拒收法定质疑期内的质疑函）与第十二条（质疑函的形式要求）
      excerpt: 供应商提出质疑应当提交质疑函和必要的证明材料。质疑函应当包括下列内容：（一）供应商的姓名或者名称、地址、邮编、联系人及联系电话；（二）质疑项目的名称、编号；（三）具体、明确的质疑事项和与质疑事项相关的请求；（四）事实依据；（五）必要的法律依据；（六）提出质疑的日期。采购人、采购代理机构不得拒收质疑供应商在法定质疑期内发出的质疑函，应当在收到质疑函后7个工作日内作出答复，并以书面形式通知质疑供应商和其他有关供应商。
      kind: derived-from-principle
      source: https://www.gov.cn/gongbao/content/2018/content_5288825.htm
