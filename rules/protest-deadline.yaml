    note: >-
      ✅ **本条已于 2026-10-07 换为逐字引文并回填条号**（见 rules/evidence/clause-verification.md）。
      ⚠️ kind 仍为 derived-from-principle：**该办法规范的是质疑函的接收与答复**，**未规定质疑函编号不得重复**。
      质疑函编号唯一是"同一份质疑只被登记一次"的**前提条件**：编号重复会让人无法判断
      到底是重复登记，还是两份不同质疑被错编成同一号。本次未取得明文条号，故封顶 warn。
      比较时忽略空白字符。命中通常意味着重复登记或编号抄错，需人工确认。

